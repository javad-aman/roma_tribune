name: Weekly Gather & Summarize

on:
  schedule:
    - cron: "0 13 * * 1"  # Every Monday at 1pm UTC (9am ET)
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate date window (past 7 days)
        run: |
          echo "START_DATE=$(date -u -d '7 days ago' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "END_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Gather news
        run: |
          mkdir -p data
          python -m src.gather --start $START_DATE --end $END_DATE --output data/gather.json

      - name: Summarize and translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.summarize --input data/gather.json --output data/summarized.json

      - name: Write human-readable digest
        run: |
          python - <<'EOF'
          import json, pathlib
          from datetime import date

          items = json.loads(pathlib.Path("data/summarized.json").read_text())
          today = date.today().strftime("%Y-%m-%d")

          import os
          start = os.environ.get("START_DATE", "")
          end   = os.environ.get("END_DATE", today)

          lines = [
              f"# Weekly Digest: {start} to {end}",
              f"",
              f"*Auto-generated by GitHub Actions. Run `draft.py` locally with your opinion angle to produce the newsletter.*",
              f"",
          ]

          for section in ["Transfers", "Match & Results", "Club & Other"]:
              entries = [i for i in items if i.get("section") == section]
              if not entries:
                  continue
              lines.append(f"## {section} ({len(entries)} items)\n")
              for e in entries:
                  lines.append(f"**[{e['reliability']}] {e['headline']}**")
                  lines.append(f"{e['summary']}")
                  lines.append(f"*{e['source']} — {e['date']}*\n")

          pathlib.Path("content/weekly-digest.md").write_text("\n".join(lines), encoding="utf-8")
          print(f"Wrote {len(items)} items to content/weekly-digest.md")
          EOF

      - name: Upload summarized JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.END_DATE }}
          path: data/summarized.json
          retention-days: 14

      - name: Commit digest to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/weekly-digest.md
          git diff --cached --quiet || git commit -m "chore: weekly digest ${{ env.START_DATE }} to ${{ env.END_DATE }}"
          git pull --rebase origin develop
          git push

      - name: Email digest
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: Roma Tribune <${{ secrets.EMAIL_ADDRESS }}>
          subject: "Roma Tribune digest: ${{ env.START_DATE }} to ${{ env.END_DATE }}"
          body: ""
          html_body: ""
          attachments: content/weekly-digest.md
          convert_markdown: true
