name: Daily Gather & Summarize

on:
  schedule:
    - cron: "0 8 * * *"   # Every day at 8am UTC (4am ET / 10am CET)
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Calculate date window (past 7 days)
        run: |
          echo "START_DATE=$(date -u -d '1 day ago' +%Y-%m-%d)" >> $GITHUB_ENV
          echo "END_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Gather news
        run: |
          mkdir -p data
          python -m src.gather --start $START_DATE --end $END_DATE --output data/gather.json

      - name: Summarize and translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.summarize --input data/gather.json --output data/summarized.json

      - name: Write human-readable digest
        run: |
          python - <<'EOF'
          import json, pathlib
          from datetime import date

          items = json.loads(pathlib.Path("data/summarized.json").read_text())
          today = date.today().strftime("%Y-%m-%d")

          import os
          start = os.environ.get("START_DATE", "")
          end   = os.environ.get("END_DATE", today)

          lines = [
              f"# Weekly Digest: {start} to {end}",
              f"",
              f"*Auto-generated by GitHub Actions. Run `draft.py` locally with your opinion angle to produce the newsletter.*",
              f"",
          ]

          for section in ["Transfers", "Match & Results", "Club & Other"]:
              entries = [i for i in items if i.get("section") == section]
              if not entries:
                  continue
              lines.append(f"## {section} ({len(entries)} items)\n")
              for e in entries:
                  lines.append(f"**{e['headline']}**")
                  lines.append(f"{e['summary']}")
                  lines.append(f"*{e.get('source', '')}*\n")

          pathlib.Path("content/weekly-digest.md").write_text("\n".join(lines), encoding="utf-8")
          print(f"Wrote {len(items)} items to content/weekly-digest.md")
          EOF

      - name: Upload summarized JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.END_DATE }}
          path: data/summarized.json
          retention-days: 14

      - name: Commit digest to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/weekly-digest.md
          git diff --cached --quiet || git commit -m "chore: daily digest ${START_DATE} to ${END_DATE}"
          git pull --rebase origin develop
          git push origin develop

      - name: Email digest via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          START_DATE: ${{ env.START_DATE }}
          END_DATE: ${{ env.END_DATE }}
        run: |
          python - <<'EOF'
          import json, os, pathlib, requests

          digest = pathlib.Path("content/weekly-digest.md").read_text(encoding="utf-8")
          start  = os.environ["START_DATE"]
          end    = os.environ["END_DATE"]
          to     = os.environ["EMAIL_ADDRESS"]
          key    = os.environ["RESEND_API_KEY"]

          # Convert markdown to simple HTML paragraphs
          lines = digest.splitlines()
          html_lines = []
          for line in lines:
              if line.startswith("## "):
                  html_lines.append(f"<h2>{line[3:]}</h2>")
              elif line.startswith("# "):
                  html_lines.append(f"<h1>{line[2:]}</h1>")
              elif line.startswith("**") and line.endswith("**"):
                  html_lines.append(f"<strong>{line[2:-2]}</strong>")
              elif line.startswith("*") and line.endswith("*"):
                  html_lines.append(f"<em>{line[1:-1]}</em>")
              elif line.strip() == "":
                  html_lines.append("<br>")
              else:
                  html_lines.append(f"<p>{line}</p>")
          html = "\n".join(html_lines)

          payload = {
              "from": "Roma Tribune <onboarding@resend.dev>",
              "to": [to],
              "subject": f"Roma Tribune digest: {start} to {end}",
              "html": html,
          }

          resp = requests.post(
              "https://api.resend.com/emails",
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
              json=payload,
              timeout=15,
          )
          resp.raise_for_status()
          print(f"Email sent: {resp.json()}")
          EOF
